name: Daily Attendee Sync

on:
  schedule:
    # 7:15 AM PT (14:15 UTC), Mon-Fri
    # Offset 15 min from pacing bot so they don't collide
    - cron: "15 14 * * 1-5"

  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  sync-attendees:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attendee sync
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          LUMA_EVENT_ID: ${{ secrets.LUMA_EVENT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python attendee_sync.py
